name: Deploy Angular Portfolio

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build

      - name: Debug OIDC subject
        shell: bash
        run: |
          set -euo pipefail

          token_response=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          token=$(echo "$token_response" | jq -r '.value')

          payload=$(echo "$token" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq -r '.sub')

          echo "OIDC subject: $payload"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::088146583899:role/GitHubActionsPortfolioDeploy
          aws-region: us-east-2

      - name: Deploy to S3
        run: aws s3 sync dist/cv-web/browser s3://cv-web-088146583899-us-east-2-an --delete
